name: Release

# Triggers on every merge (push) to main.
on:
  push:
    branches: [main]

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    # Needed to create tags and publish the release.
    permissions:
      contents: write
      id-token: write   # required for PyPI trusted publishing (OIDC)

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so git tag -l works correctly
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute the next version ───────────────────────────────────────────────
      # VERSION file contains MAJOR.MINOR (e.g. "0.3").
      # Patch is derived from the highest existing git tag for that MAJOR.MINOR
      # and incremented by 1.  If no tags exist yet, patch starts at 0.
      - name: Compute version
        id: ver
        run: |
          BASE=$(cat VERSION | tr -d '[:space:]')
          echo "Base version: $BASE"

          LATEST=$(git tag -l "v${BASE}.*" | sort -V | tail -1)
          echo "Latest matching tag: ${LATEST:-none}"

          if [ -z "$LATEST" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST" | sed "s/v${BASE}\.//")
            PATCH=$((PATCH + 1))
          fi

          FULL="${BASE}.${PATCH}"
          TAG="v${FULL}"
          echo "New version: $TAG"

          echo "full=${FULL}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}"   >> $GITHUB_OUTPUT

      # ── Bump version in pyproject.toml (build-time only, not committed back) ──
      - name: Bump version in pyproject.toml
        run: |
          VER="${{ steps.ver.outputs.full }}"
          sed -i "s/^version = \".*\"/version = \"${VER}\"/" pyproject.toml

      # ── Build wheel + sdist ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      # ── Generate SBOMs (CNCF requirement) ─────────────────────────────────────
      # Build a clean runtime environment so the SBOM reflects the distributed
      # artifact and its actual transitive dependency tree.
      - name: Create runtime venv and install package
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install dist/*.whl

      - name: Install SBOM tooling
        run: |
          python -m venv .tools-venv
          .tools-venv/bin/pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: |
          .tools-venv/bin/cyclonedx-py environment .sbom-venv/bin/python \
            --pyproject pyproject.toml \
            -o sbom.cyclonedx.json --of JSON

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SPDX SBOM
        run: |
          .sbom-venv/bin/pip freeze > requirements.sbom.txt
          syft file:requirements.sbom.txt -o spdx-json=sbom.spdx.json

      - name: Generate license report
        run: |
          .sbom-venv/bin/pip install pip-licenses
          .sbom-venv/bin/pip-licenses --format=json --output-file=licenses.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pass-sbom
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
            licenses.json

      # ── Run tests ─────────────────────────────────────────────────────────────
      - name: Install package + test deps
        run: pip install ".[dev]"

      - name: Test
        run: pytest

      # ── Publish to PyPI (trusted publishing / OIDC) ───────────────────────────
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # ── Attest build provenance (CNCF / GitHub) ───────────────────────────────
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cyclonedx.json
            sbom.spdx.json
            licenses.json

      # ── Tag & publish GitHub release ──────────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:              ${{ steps.ver.outputs.tag }}
          name:                  WAF++ PASS (wafpass-core) ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.cyclonedx.json
            sbom.spdx.json
            licenses.json
